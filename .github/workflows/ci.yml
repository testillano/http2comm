name: CI
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker images tag'
        required: true
  push:
    branches:
      - master
    tags:
      - v*.*.*

  pull_request:
    branches:
      - master

jobs:
  format_style:
    name: Check source code format
    runs-on: ubuntu-latest
    steps:
    -
      name: Check out the repo
      uses: actions/checkout@v4
    -
      name: Run frankwolf format
      run: |
          sources=$(find . -name "*.hpp" -o -name "*.cpp")
          ! docker run -i --rm -v $PWD:/data frankwolf/astyle --dry-run ${sources} | grep ^Formatted

  build_and_push:
    needs: format_style
    name: Build and push docker images
    runs-on: ubuntu-latest
    steps:
    -
      name: Check out the repo
      uses: actions/checkout@v4
    -
      name: Login to GitHub Container Registry
      uses: docker/login-action@v1
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
        logout: true
    -
      name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    -
      name: Build builder image (deps stage)
      id: docker_build1
      uses: docker/build-push-action@v2
      with:
        tags: ghcr.io/testillano/http2comm_builder:local
        file: Dockerfile
        target: deps
        context: .
        platforms: linux/amd64
        no-cache: true
        push: true
    -
      name: Build project image (deps + library)
      id: docker_build2
      uses: docker/build-push-action@v2
      with:
        tags: ghcr.io/testillano/http2comm:local
        file: Dockerfile
        target: build
        context: .
        platforms: linux/amd64
        load: true
    -
      name: Push images
      run: |
        # workflow dispatch event:
        image_tag=${{ github.event.inputs.tag }}
        echo Workflow dispatch image_tag=$image_tag

        # Strip git ref prefix from version
        [ -z "${image_tag}" ] && image_tag=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')

        # Strip "v" prefix from tag name
        [[ "${{ github.ref }}" == "refs/tags/"* ]] && image_tag=$(echo $image_tag | sed -e 's/^v//')

        # Use Docker `latest` tag convention
        [ "$image_tag" == "master" ] && image_tag=latest

        echo Processed image_tag=$image_tag

        # Builder already pushed as :local, re-tag
        docker pull ghcr.io/testillano/http2comm_builder:local
        docker tag ghcr.io/testillano/http2comm_builder:local ghcr.io/testillano/http2comm_builder:${image_tag}
        docker push ghcr.io/testillano/http2comm_builder:${image_tag}

        # Project image
        docker tag ghcr.io/testillano/http2comm:local ghcr.io/testillano/http2comm:${image_tag}
        docker push ghcr.io/testillano/http2comm:${image_tag}
